<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Цифровизация Туркестанской области — отчёт руководству</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --border: #e7ebf2;
    --text: #10192e;
    --text-2: #526080;
    --text-3: #98a2ba;
    --accent: #2454d6;
    --accent-2: #0f9e8f;
    --accent-3: #6d4fe0;
    --accent-soft: #eaf0ff;
    --success: #128a5c;
    --success-soft: #e7f7ef;
    --warning: #b56a0a;
    --warning-soft: #fdf1e0;
    --danger: #c3303f;
    --danger-soft: #fbeaec;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(20,30,60,.05);
    --shadow-md: 0 14px 34px -16px rgba(20,30,70,.18);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::selection { background: var(--accent-soft); color: var(--accent); }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Top header ---------- */
  .topheader {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px calc(28px + env(safe-area-inset-left,0px)) 14px calc(28px + env(safe-area-inset-left,0px));
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 26px; flex-wrap: wrap; position: sticky; top:0; z-index: 20;
  }
  .th-brand { display: flex; align-items: center; gap: 11px; margin-right: 6px; }
  .th-mark {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:"Manrope",sans-serif; font-weight:800; font-size:16px;
  }
  .th-name { font-family:"Manrope",sans-serif; font-weight:800; font-size: 14.5px; color: var(--text); line-height:1.25; }
  .th-sub { font-size: 11px; color: var(--text-3); margin-top:1px; }
  .th-tabs { display:flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .th-tab {
    background: none; border: none; font: inherit; cursor: pointer; color: var(--text-2);
    font-size: 13.5px; font-weight: 600; padding: 9px 13px; border-radius: 8px;
    position: relative; transition: color .15s ease, background .15s ease;
  }
  .th-tab:hover { color: var(--accent); background: var(--surface-2); }
  .th-tab.active { color: var(--accent); }
  .th-tab.active::after {
    content:""; position:absolute; left:13px; right:13px; bottom:-1px; height:2px; background: var(--accent); border-radius: 2px;
  }
  .th-actions { display:flex; align-items:center; gap:10px; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 9px; font-size: 12.8px; cursor: pointer; font-weight: 600;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-3)); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter:brightness(1.07); color:#fff; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(120deg, #16255c 0%, #234ac9 55%, #1c8f95 130%);
    padding: 30px 30px 34px;
  }
  .hero-decor { position:absolute; inset:0; opacity:.5; }
  .hero-inner { position: relative; max-width: 1200px; }
  .crumbs { font-size: 12.5px; color: rgba(255,255,255,.72); display:flex; align-items:center; gap:7px; margin-bottom: 14px; flex-wrap: wrap; }
  .crumbs b { color: #fff; font-weight: 600; }
  .crumbs .sep { opacity: .5; }
  .hero-title { font-family:"Manrope",sans-serif; font-size: 27px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .hero-meta { display:flex; align-items:center; gap:10px; margin-top: 14px; flex-wrap: wrap; }
  .hero-pill {
    font-size: 11.8px; font-weight: 600; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    padding: 6px 12px; border-radius: 20px; color: #fff; backdrop-filter: blur(3px);
  }

  /* ---------- Layout ---------- */
  .layout { display: flex; align-items: flex-start; max-width: 1280px; margin: 0 auto; padding: 26px 26px 70px; gap: 26px; }
  .sidebar-col { width: 250px; flex-shrink: 0; position: sticky; top: 84px; }
  .sidebar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow-sm); }
  .side-link {
    display:block; padding: 11px 14px; border-radius: 9px; font-size: 13.6px; font-weight: 600; color: var(--text-2);
    cursor: pointer; margin-bottom: 2px; transition: background .15s ease, color .15s ease;
  }
  .side-link:hover { background: var(--surface-2); color: var(--text); }
  .side-link.active { color: var(--accent); background: var(--accent-soft); }

  .content-col { flex: 1; min-width: 0; }

  @media (max-width: 880px) {
    .layout { flex-direction: column; padding: 18px; }
    .sidebar-col { width: 100%; position: static; }
    .sidebar-card { display:flex; overflow-x:auto; gap:4px; }
    .side-link { white-space: nowrap; margin-bottom:0; }
    .topheader { padding-left: 18px; padding-right: 18px; }
    .hero { padding: 24px 18px 28px; }
  }

  /* ---------- KPI ---------- */
  .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 14px; margin-bottom: 6px; }
  .kpi-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 16px 14px; animation: fadeUp .4s ease both;
  }
  .kpi-label { font-size: 11.2px; color: var(--text-3); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi-value { font-family:"Manrope",sans-serif; font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
  .kpi-note { font-size: 11.8px; color: var(--text-3); margin-top: 6px; line-height:1.4; }
  .kpi-input {
    font-family:"Manrope",sans-serif; font-size: 19px; font-weight: 800; color: var(--text);
    border: 1.5px dashed var(--accent); border-radius: 7px; padding: 3px 7px; width: 100%; background: var(--accent-soft);
  }

  /* ---------- Overview (flat dashboard) ---------- */
  .ov-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm); animation: fadeUp .45s ease both;}
  .ov-card h3 { margin: 0 0 4px; font-size: 15.5px; font-family:"Manrope",sans-serif; font-weight:700; display:flex; align-items:center; gap:8px; }
  .ov-card h3::before { content:""; width:4px; height:14px; border-radius:3px; background: linear-gradient(180deg,var(--accent),var(--accent-2)); }
  .ov-card .sub { font-size:12.3px; color:var(--text-3); margin-bottom:14px; }
  .two-col { display:grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
  @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- Accordion panel ---------- */
  .acc-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); animation: fadeUp .4s ease both; }
  .acc-item { border-bottom: 1px solid var(--border); }
  .acc-item:last-child { border-bottom: none; }
  .acc-header {
    width: 100%; display:flex; align-items:center; gap: 14px; text-align: left;
    background: none; border: none; font: inherit; cursor: pointer; padding: 17px 20px;
    transition: background .15s ease;
  }
  .acc-header:hover { background: var(--surface-2); }
  .acc-icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .acc-icon svg { width: 20px; height: 20px; }
  .acc-title { font-size: 14.5px; font-weight: 700; color: var(--text); }
  .acc-summary { font-size: 12.3px; color: var(--text-3); margin-top: 2px; }
  .acc-titlewrap { display:flex; flex-direction:column; gap:1px; }
  .acc-chevron { margin-left: auto; color: var(--text-3); transition: transform .3s ease; flex-shrink:0; }
  .acc-item.open .acc-chevron { transform: rotate(180deg); color: var(--accent); }
  .acc-body-wrap { display:grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.2,.8,.2,1); }
  .acc-item.open .acc-body-wrap { grid-template-rows: 1fr; }
  .acc-body { overflow: hidden; min-height: 0; }
  .acc-content { padding: 4px 20px 22px 20px; }
  .acc-content > * + * { margin-top: 16px; }

  ul.bullets { margin:0; padding-left:0; color:var(--text-2); font-size:13.4px; line-height:1.68; list-style:none; }
  ul.bullets li { margin-bottom:8px; padding-left:19px; position:relative; }
  ul.bullets li::before { content:""; position:absolute; left:0; top:7px; width:6px; height:6px; border-radius:2px; background: linear-gradient(135deg,var(--accent),var(--accent-2)); }
  ul.bullets.tight li { margin-bottom:4px; }

  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background: var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 11px; font-size:12px; color:var(--text-2); }
  .chip b { color: var(--text); }

  .badge { display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; background:var(--accent-soft); color:var(--accent); }
  .badge.bad { background: var(--danger-soft); color: var(--danger); }

  table.data-table { width:100%; border-collapse:collapse; font-size:12.8px; }
  table.data-table th { text-align:left; color:var(--text-3); font-weight:700; font-size:10.8px; text-transform:uppercase; letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--border); }
  table.data-table td { padding:10px 10px; border-bottom:1px solid var(--border); color:var(--text-2); }
  table.data-table tr:last-child td { border-bottom:none; }
  .table-wrap { overflow-x:auto; }

  .pill-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; }
  @media (max-width:700px){ .pill-grid { grid-template-columns:1fr; } }
  .step-pill { background: var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:14px; }

  .item-list { display:flex; flex-direction:column; gap:12px; }
  .item-row { padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
  .item-title { font-size:13.3px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .item-text { font-size:12.8px; color:var(--text-2); line-height:1.6; }

  .loading-screen { display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; height:100vh; color:var(--text-2); font-size:13.5px; background: var(--bg); }
  .spinner { width:32px; height:32px; border-radius:50%; border:3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }

  .edit-banner { display:flex; align-items:center; gap:10px; background: var(--accent-soft); color: var(--accent); border:1px solid var(--accent); border-radius:11px; padding:11px 16px; font-size:12.5px; margin-bottom:16px; font-weight:500; }
  .footer-note { font-size: 11.3px; color: var(--text-3); text-align:center; padding: 22px 0 0; }
</style>
</head>

/* ============================================================
   Animated counter
============================================================ */
function useAnimatedValue(raw) {
  const match = String(raw).match(/^([^\d]*)([\d\s]+(?:[.,]\d+)?)(.*)$/);
  const [display, setDisplay] = useState(raw);
  useEffect(() => {
    if (!match) { setDisplay(raw); return; }
    const [, prefix, numPart, suffix] = match;
    const clean = numPart.replace(/\s/g, "").replace(",", ".");
    const target = parseFloat(clean);
    if (isNaN(target)) { setDisplay(raw); return; }
    const isInt = !clean.includes(".");
    const duration = 650; const start = performance.now(); let raf;
    function step(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = target * eased;
      const formatted = isInt ? Math.round(val).toLocaleString("ru-RU") : val.toFixed(clean.split(".")[1]?.length || 1);
      setDisplay(prefix + formatted + suffix);
      if (p < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [raw]);
  return display;
}

/* ============================================================
   Charts
============================================================ */
function BarChart({ data, height = 180, colorVar = "--accent", valueSuffix = "" }) {
  const [grown, setGrown] = useState(false);
  useEffect(() => { const t = setTimeout(() => setGrown(true), 30); return () => clearTimeout(t); }, [data]);
  const max = Math.max(1, ...data.map(d => d.value));
  const gid = "bg-" + colorVar.replace("--", "");
  return (
    <svg viewBox="0 0 600 210" style={{ width: "100%", height, overflow: "visible" }} preserveAspectRatio="none">
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={`var(${colorVar})`} stopOpacity="1" />
        <stop offset="100%" stopColor={`var(${colorVar})`} stopOpacity=".55" />
      </linearGradient></defs>
      {data.map((d, i) => {
        const barH = grown ? (d.value / max) * 150 : 0;
        const x = i * (600 / data.length) + 10;
        const bw = (600 / data.length) - 20;
        return (
          <g key={i}>
            <rect x={x} y={170 - barH} width={bw} height={barH} rx="5" fill={`url(#${gid})`}
              style={{ transition: `height .7s cubic-bezier(.2,.8,.2,1) ${i * 60}ms, y .7s cubic-bezier(.2,.8,.2,1) ${i * 60}ms` }} />
            <text x={x + bw / 2} y={188} textAnchor="middle" fontSize="11" fill="var(--text-3)">{d.label}</text>
            <text x={x + bw / 2} y={162 - barH} textAnchor="middle" fontSize="11.5" fontWeight="700" fill="var(--text)"
              style={{ opacity: grown ? 1 : 0, transition: `y .7s ease ${i * 60}ms, opacity .4s ease ${i * 60 + 200}ms` }}>
              {d.value}{valueSuffix}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function GroupedTrend({ data }) {
  const [grown, setGrown] = useState(false);
  useEffect(() => { const t = setTimeout(() => setGrown(true), 30); return () => clearTimeout(t); }, [data]);
  const max = Math.max(1, ...data.flatMap(d => [d.g4, d.g3, d.gap]));
  const seriesKeys = [["g4", "--accent", "4G"], ["g3", "--accent-2", "3G"], ["gap", "--warning", "Нет покрытия"]];
  const groupW = 600 / data.length;
  return (
    <div>
      <svg viewBox="0 0 600 210" style={{ width: "100%", height: 185, overflow: "visible" }} preserveAspectRatio="none">
        {data.map((d, i) => {
          const gx = i * groupW;
          return (
            <g key={i}>
              {seriesKeys.map(([key, colorVar], si) => {
                const barH = grown ? (d[key] / max) * 145 : 0;
                const bw = (groupW - 30) / 3;
                const x = gx + 15 + si * bw;
                return <rect key={key} x={x} y={165 - barH} width={bw - 4} height={barH} rx="4" fill={`var(${colorVar})`} opacity=".92"
                  style={{ transition: `height .7s cubic-bezier(.2,.8,.2,1) ${(i * 3 + si) * 55}ms, y .7s cubic-bezier(.2,.8,.2,1) ${(i * 3 + si) * 55}ms` }} />;
              })}
              <text x={gx + groupW / 2} y={184} textAnchor="middle" fontSize="12.3" fontWeight="700" fill="var(--text-2)">{d.label}</text>
            </g>
          );
        })}
      </svg>
      <div className="chip-row">
        {seriesKeys.map(([key, colorVar, label]) => (
          <span className="chip" key={key}><span style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:`var(${colorVar})`, marginRight:6 }} />{label}</span>
        ))}
      </div>
    </div>
  );
}

function Donut({ data, size = 148 }) {
  const [grown, setGrown] = useState(false);
  useEffect(() => { const t = setTimeout(() => setGrown(true), 30); return () => clearTimeout(t); }, [data]);
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const colors = ["--accent", "--accent-2", "--warning", "--danger", "--success", "--accent-3"];
  let acc = 0; const r = 58, c = 2 * Math.PI * r;
  return (
    <div style={{ display:"flex", alignItems:"center", gap:18, flexWrap:"wrap" }}>
      <svg width={size} height={size} viewBox="0 0 150 150">
        <g transform="translate(75,75) rotate(-90)">
          <circle r={r} fill="none" stroke="var(--border)" strokeWidth="16" />
          {data.map((d, i) => {
            const frac = d.value / total;
            const dash = grown ? frac * c : 0;
            const offset = grown ? -acc : 0;
            const el = <circle key={i} r={r} fill="none" stroke={`var(${colors[i % colors.length]})`} strokeWidth="16"
              strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={offset} strokeLinecap="round"
              style={{ transition: `stroke-dasharray .8s cubic-bezier(.2,.8,.2,1) ${i * 90}ms` }} />;
            acc += frac * c; return el;
          })}
        </g>
        <text x="75" y="80" textAnchor="middle" fontSize="18" fontWeight="800" fontFamily="Manrope, sans-serif" fill="var(--text)">{total.toLocaleString("ru-RU")}</text>
      </svg>
      <div className="chip-row" style={{ marginTop:0 }}>
        {data.map((d, i) => (
          <span className="chip" key={i}><span style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:`var(${colors[i % colors.length]})`, marginRight:6 }} />{d.label}: <b>{d.value.toLocaleString("ru-RU")}</b></span>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   KPI
============================================================ */
function KpiCard({ kpi, editable, onChange, index }) {
  const animated = useAnimatedValue(kpi.value);
  return (
    <div className="kpi-card" style={{ animationDelay: (index * 40) + "ms" }}>
      <div className="kpi-label">{kpi.label}</div>
      {editable ? <input className="kpi-input" value={kpi.value} onChange={(e) => onChange(kpi.id, e.target.value)} /> : <div className="kpi-value">{animated}</div>}
      {kpi.note && <div className="kpi-note">{kpi.note}</div>}
    </div>
  );
}
function KpiGrid({ kpis, editable, onChange }) {
  return <div className="kpi-grid">{kpis.map((k, i) => <KpiCard key={k.id} kpi={k} editable={editable} onChange={onChange} index={i} />)}</div>;
}

/* ============================================================
   Accordion block content
============================================================ */
function renderChart(chart) {
  if (chart.kind === "bar") return <BarChart data={chart.data} colorVar={chart.colorVar || "--accent"} valueSuffix={chart.valueSuffix || ""} />;
  if (chart.kind === "donut") return <Donut data={chart.data} />;
  if (chart.kind === "trend") return <GroupedTrend data={chart.data} />;
  return null;
}

function BlockContent({ block, editable, onKpiChange }) {
  return (
    <div className="acc-content">
      {block.kpis && <KpiGrid kpis={block.kpis} editable={editable} onChange={onKpiChange} />}
      {block.chart && renderChart(block.chart)}
      {block.chips && <div className="chip-row">{block.chips.map((c, i) => <span className="chip" key={i}>{c}</span>)}</div>}
      {block.bullets && block.bullets.length > 0 && <ul className="bullets">{block.bullets.map((t, i) => <li key={i}>{t}</li>)}</ul>}
      {block.table && (
        <div className="table-wrap"><table className="data-table">
          <thead><tr>{block.table.head.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
          <tbody>{block.table.rows.map((row, i) => <tr key={i}>{row.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
        </table></div>
      )}
      {block.pills && (
        <div className="pill-grid">{block.pills.map((s, i) => (
          <div key={i} className="step-pill"><span className="badge">Шаг {i + 1}</span>
            <div style={{ fontWeight:700, margin:"9px 0 4px", fontSize:13.4 }}>{s.title}</div>
            <div style={{ fontSize:12.4, color:"var(--text-2)" }}>{s.desc}</div>
          </div>
        ))}</div>
      )}
      {block.items && (
        <div className="item-list">{block.items.map((it, i) => (
          <div className="item-row" key={i}><div className="item-title">{it.title}</div><div className="item-text">{it.text}</div></div>
        ))}</div>
      )}
    </div>
  );
}

function AccordionBlock({ block, isOpen, onToggle, editable, onKpiChange }) {
  return (
    <div className={"acc-item" + (isOpen ? " open" : "")}>
      <button className="acc-header" onClick={onToggle}>
        <span className="acc-icon"><Icon name={block.icon} /></span>
        <span className="acc-titlewrap">
          <span className="acc-title">{block.title}</span>
          {block.summary && <span className="acc-summary">{block.summary}</span>}
        </span>
        <span className="acc-chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6" /></svg>
        </span>
      </button>
      <div className="acc-body-wrap"><div className="acc-body">
        <BlockContent block={block} editable={editable} onKpiChange={onKpiChange} />
      </div></div>
    </div>
  );
}

function PageAccordion({ page, editable, onKpiChange }) {
  const [openIds, setOpenIds] = useState(() => new Set(page.blocks[0] ? [page.blocks[0].id] : []));
  useEffect(() => { setOpenIds(new Set(page.blocks[0] ? [page.blocks[0].id] : [])); }, [page]);
  const toggle = (id) => setOpenIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  return (
    <div className="acc-panel">
      {page.blocks.map(b => (
        <AccordionBlock key={b.id} block={b} isOpen={openIds.has(b.id)} onToggle={() => toggle(b.id)} editable={editable} onKpiChange={onKpiChange} />
      ))}
    </div>
  );
}

/* ============================================================
   Overview (flat dashboard, not accordion)
============================================================ */
function OverviewView({ data, editable, onKpiChange }) {
  return (
    <>
      <div className="ov-card"><KpiGrid kpis={data.kpis} editable={editable} onChange={onKpiChange} /></div>
      <div className="two-col">
        <div className="ov-card">
          <h3>Динамика покрытия связью, 2024–2026</h3>
          <div className="sub">Количество населённых пунктов по типу покрытия</div>
          <GroupedTrend data={data.coverageTrend} />
        </div>
        <div className="ov-card">
          <h3>Ключевые выводы</h3>
          <ul className="bullets">{data.highlights.map((h, i) => <li key={i}>{h}</li>)}</ul>
        </div>
      </div>
    </>
  );
}

/* ============================================================
   App
============================================================ */
function App() {
  const [overview, setOverview] = useState(null);
  const [pages, setPages] = useState(null);
  const [activeCategory, setActiveCategory] = useState("overview");
  const [activePage, setActivePage] = useState("overview");
  const [dbNs, setDbNs] = useState(null);
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const pendingSave = useRef(null);

  useEffect(() => {
    let cancelled = false;
    const failsafe = setTimeout(() => {
      setOverview(prev => prev || OVERVIEW);
      setPages(prev => prev || PAGES);
    }, 4000);
    async function init() {
      let db = null, user = null;
      try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
      try { user = window.claude ? await window.claude.use("user") : null; } catch (e) { user = null; }
      if (cancelled) return;
      setDbNs(db);
      if (db) {
        try {
          const snap = await db.doc("dashboard/main").get();
          if (snap && snap.exists) {
            const body = snap.data();
            if (body && body.overview && body.pages) {
              if (!cancelled) { setOverview(body.overview); setPages(body.pages); }
              return;
            }
          }
        } catch (e) { /* fall through to seed */ }
        try { await db.doc("dashboard/main").set({ overview: OVERVIEW, pages: PAGES }); } catch (e) { /* ignore */ }
      }
      if (!cancelled) { setOverview(OVERVIEW); setPages(PAGES); }
    }
    init().finally(() => clearTimeout(failsafe));
    return () => { cancelled = true; clearTimeout(failsafe); };
  }, []);

  const persist = useCallback((nextOverview, nextPages) => {
    if (!dbNs) return;
    clearTimeout(pendingSave.current);
    pendingSave.current = setTimeout(async () => {
      setSaving(true);
      try { await dbNs.doc("dashboard/main").set({ overview: nextOverview, pages: nextPages }); setSavedAt(new Date()); }
      catch (e) { /* ignore */ }
      setSaving(false);
    }, 500);
  }, [dbNs]);

  const handleOverviewKpiChange = useCallback((id, value) => {
    setOverview(prev => {
      const next = { ...prev, kpis: prev.kpis.map(k => k.id === id ? { ...k, value } : k) };
      persist(next, pages); return next;
    });
  }, [persist, pages]);

  const handlePageKpiChange = useCallback((pageId) => (id, value) => {
    setPages(prev => {
      const page = prev[pageId];
      const blocks = page.blocks.map(b => b.kpis ? { ...b, kpis: b.kpis.map(k => k.id === id ? { ...k, value } : k) } : b);
      const next = { ...prev, [pageId]: { ...page, blocks } };
      persist(overview, next); return next;
    });
  }, [persist, overview]);

  if (!overview || !pages) {
    return <div className="loading-screen"><div className="spinner" />Загрузка панели показателей…</div>;
  }

  const category = CATEGORIES.find(c => c.id === activeCategory) || CATEGORIES[0];
  const isOverview = category.standalone;
  const page = isOverview ? null : pages[activePage];

  function selectCategory(cat) {
    setActiveCategory(cat.id);
    setActivePage(cat.pages[0]);
  }

  return (
    <div>
      <header className="topheader">
        <div className="th-brand">
          <div className="th-mark">Т</div>
          <div><div className="th-name">Түркістан облысы</div><div className="th-sub">Цифрландыру басқармасы</div></div>
        </div>
        <nav className="th-tabs">
          {CATEGORIES.map(c => (
            <button key={c.id} className={"th-tab" + (activeCategory === c.id ? " active" : "")} onClick={() => selectCategory(c)}>{c.title}</button>
          ))}
        </nav>
        <div className="th-actions">
          {saving && <span style={{ fontSize:12, color:"var(--text-3)" }}>Сохранение…</span>}
          {!saving && savedAt && <span style={{ fontSize:12, color:"var(--success)" }}>Сохранено</span>}
        </div>
      </header>

      <div className="hero">
        <svg className="hero-decor" viewBox="0 0 1200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 160 L150 90 L280 140 L420 60 L560 130 L700 80 L860 150 L1000 70 L1200 140 L1200 200 L0 200 Z" fill="rgba(255,255,255,.06)" />
          <path d="M0 180 L200 130 L380 170 L520 110 L680 160 L860 120 L1050 175 L1200 150 L1200 200 L0 200 Z" fill="rgba(255,255,255,.09)" />
        </svg>
        <div className="hero-inner">
          <div className="crumbs">
            <span>Главная</span><span className="sep">›</span>
            <span>{category.title}</span>
            {!isOverview && <><span className="sep">›</span><b>{page.title}</b></>}
          </div>
          <h1 className="hero-title">{isOverview ? "Обзор показателей" : page.title}</h1>
          <div className="hero-meta">
            <span className="hero-pill">Отчёт для руководства</span>
            <span className="hero-pill">Түркістан облысы · обновлено 2026 ж.</span>
          </div>
        </div>
      </div>

      <div className="layout">
        {!isOverview && (
          <div className="sidebar-col">
            <div className="sidebar-card">
              {category.pages.map(pid => (
                <div key={pid} className={"side-link" + (activePage === pid ? " active" : "")} onClick={() => setActivePage(pid)}>
                  {PAGE_TITLES[pid]}
                </div>
              ))}
            </div>
          </div>
        )}
        <div className="content-col">
          {isOverview
            ? <OverviewView data={overview} editable={false} onKpiChange={handleOverviewKpiChange} />
            : <PageAccordion key={activePage} page={page} editable={false} onKpiChange={handlePageKpiChange(activePage)} />}
          <div className="footer-note">Данные сформированы на основе отчёта Управления цифровизации, государственных услуг и архивов Түркістан облысы.</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
